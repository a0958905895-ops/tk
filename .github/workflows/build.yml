name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example
          fi

      - name: Upgrade AGP, Gradle Wrapper & Kotlin
        run: |
          # 1. 升級 Android Gradle Plugin (8.3.0) 與 Kotlin (1.9.20)
          sed -i 's/id "com.android.application" version .*/id "com.android.application" version "8.3.0" apply false/' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.20" apply false/' android/settings.gradle
          
          # 2. 將 Gradle 包版本升級至 8.4 以支援 AGP 8.3.0
          sed -i 's/gradle-.*-all.zip/gradle-8.4-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 3. 設定 compileSdk 為 35
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
